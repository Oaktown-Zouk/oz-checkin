# The student site's ONE config file — used both by the real deployed site and by
# local `npm run dev:netlify-student` (see root package.json). Netlify requires the
# file to be literally named `netlify.toml` (a custom name like the earlier
# `netlify-student.toml` this repo used isn't recognized at all, confirmed via
# Netlify's own docs and support forum), so this lives inside web-student/ instead of
# at the repo root — the staff app's netlify.toml already claims that spot.
#
# Deployed-site setup: point the site's "Package directory" at `web-student` (leave
# "Base directory" unset/at the repo root — Netlify's docs confirm paths inside this
# file resolve against the base directory, not the package directory, regardless of
# where the file itself lives, so `publish`/`functions.directory` below stay
# root-relative same as the staff app's own netlify.toml). No "Configuration file
# path" override needed — setting the package directory is enough for Netlify to find
# this file on its own (it checks the package directory first).
#
# Locally, `netlify dev --filter web-student` (see dev:netlify-student) discovers this
# same file via its own config search, and resolves these same paths the same way —
# confirmed by actually running it, not assumed.

[build]
  command = "npm run build"
  publish = "web-student/dist"

[functions]
  directory = "netlify/functions-student"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
